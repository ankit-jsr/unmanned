name: pages

# Publishes site/ to GitHub Pages. Requires Settings > Pages > Source: "GitHub Actions".
# Manual only until gate 3 (cross-model review) has passed on the pages: publishing outside
# the repo needs all three gates (CLAUDE.md section 4). Add the push trigger back after that:
#   push: {branches: [main], paths: ["site/**", ".github/workflows/pages.yml"]}
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
