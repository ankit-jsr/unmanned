# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: content-check
        name: content placeholders and links
        entry: python3 scripts/check_content.py
        language: system
        pass_filenames: false
